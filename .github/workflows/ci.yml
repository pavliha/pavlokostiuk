name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - name: Build the image Dokploy will build
        run: docker build -t pavlokostiuk-cloud .

      - name: Serve it and check every locale
        run: |
          trap 'docker rm -f site > /dev/null 2>&1 || true' EXIT
          docker run -d --name site -p 8099:80 pavlokostiuk-cloud
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8099/en; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "container never became ready"
            docker logs site
            exit 1
          fi
          fail=0
          for locale in en ka uk ru; do
            for page in "" /ecommerce /about /drones; do
              path="/$locale$page"
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099$path")
              [ "$code" = "200" ] || { echo "FAIL $path -> $code"; fail=1; }
            done
          done
          for path in /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099$path")
            [ "$code" = "200" ] || { echo "FAIL $path -> $code"; fail=1; }
          done
          for path in / /ecommerce; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099$path")
            [ "$code" = "307" ] || { echo "FAIL $path -> $code (expected 307)"; fail=1; }
          done
          for path in /index.html /ecommerce.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099$path")
            [ "$code" = "308" ] || { echo "FAIL $path -> $code (expected 308)"; fail=1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099/nonsense")
          [ "$code" = "404" ] || { echo "FAIL /nonsense -> $code (expected 404)"; fail=1; }
          exit $fail

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the verified commit on Dokploy
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          body=$(jq -n --arg sha "$HEAD_SHA" --arg message "$HEAD_MESSAGE" \
            '{ref: "refs/heads/master", head_commit: {id: $sha, message: $message}, commits: []}')
          response=$(curl -sS --retry 5 --retry-all-errors --retry-delay 15 -w '\n%{http_code}' \
            -X POST "$DOKPLOY_DEPLOY_URL" -H "Content-Type: application/json" -H "x-github-event: push" --data "$body")
          code=$(printf '%s' "$response" | tail -n1)
          printf '%s\n' "$response" | sed '$d'
          [ "$code" = "200" ] || { echo "Dokploy did not accept the deploy (HTTP $code)"; exit 1; }
